[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# Legacy distribution identifier retained for install compatibility after the branding rename.
name = "multisport-physics-sim"
version = "0.3.0"
description = "Cross-embodiment robot ball-sports training and evaluation gym."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robot Sports Gym contributors"}]
keywords = [
  "robotics",
  "reinforcement-learning",
  "mujoco",
  "isaac-sim",
  "physics-simulation",
  "robot-benchmark",
  "sports",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.0,<2",
  "mujoco>=3.2,<4",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.20"]
# The learned launch baselines (scripts/train_launch_policies.py).  CPU torch is
# enough: the policies are small and the simulator is the bottleneck.
train = ["stable-baselines3>=2.3", "torch>=2.4"]
# Only the submission packager's video export needs an image library, and a
# result package is still valid without videos, so this stays optional.
submission = ["pillow>=10"]

[project.scripts]
multisport-sim = "multisport_sim.cli:main"
multisport-isaac = "multisport_sim.isaac_cli:main"
multisport-eval = "multisport_sim.evaluation_cli:main"
multisport-benchmark = "multisport_sim.benchmark_cli:main"
multisport-squash-demo-verify = "multisport_sim.squash_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multisport_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # This package reports every malformed input as ValueError, wrong type
    # included, and its tests pin that contract.  Splitting type errors out
    # would change the public exception for a third of the validation layer
    # without making any caller's handling more precise.
    "TRY004",
]
