[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# Legacy distribution identifier retained for install compatibility after the branding rename.
name = "multisport-physics-sim"
version = "0.2.0"
description = "Cross-embodiment robot ball-sports training and evaluation gym."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robot Sports Gym contributors"}]
keywords = [
  "robotics",
  "reinforcement-learning",
  "mujoco",
  "isaac-sim",
  "physics-simulation",
  "robot-benchmark",
  "sports",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.0,<2",
  "mujoco>=3.2,<4",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
multisport-sim = "multisport_sim.cli:main"
multisport-isaac = "multisport_sim.isaac_cli:main"
multisport-eval = "multisport_sim.evaluation_cli:main"
multisport-benchmark = "multisport_sim.benchmark_cli:main"
multisport-squash-demo-verify = "multisport_sim.squash_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multisport_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
