[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multisport-physics-sim"
version = "0.1.0"
description = "A standalone MuJoCo campus for tennis, table tennis, football, badminton and basketball."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Multisport Physics Sim contributors"}]
dependencies = [
  "mujoco>=3.2,<4",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
multisport-sim = "multisport_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multisport_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

